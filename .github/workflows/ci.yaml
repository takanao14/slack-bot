name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/takanao14/slack-bot

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "gofmt needed on:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  image:
    name: image
    # Gates publishing on the tests. Tags do not run branch workflows, so a
    # separate test workflow would have let a release skip them entirely.
    needs: test
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded rather than pushed straight away so that the smoke test runs
      # against the exact image the next step publishes.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Covers what a build alone cannot: that the binary runs on this
      # architecture and that the image's own defaults are enough to reach a
      # serving state with only the two Slack tokens supplied. The tokens are
      # deliberately invalid, so the bot exits once auth.test stops retrying.
      - name: Smoke test the image
        env:
          IMAGE_REF: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
        run: |
          docker run -d --name smoke -p 18080:8080 \
            -e SLACK_BOT_TOKEN=xoxb-smoke-test \
            -e SLACK_APP_TOKEN=xapp-smoke-test \
            "${IMAGE_REF}"

          healthy=1
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/healthz; then
              healthy=0
              break
            fi
            sleep 0.5
          done

          docker logs smoke
          docker rm -f smoke >/dev/null
          if [ "${healthy}" -ne 0 ]; then
            echo "::error::/healthz did not respond"
            exit 1
          fi

      - name: Publish image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ steps.metadata.outputs.tags }}" | while read -r tag; do
            [ -n "${tag}" ] || continue
            docker push "${tag}"
          done
